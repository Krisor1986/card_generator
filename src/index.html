<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generador de cartas aleatorias con JavaScript." />
    <title>Generador de cartas</title>
  </head>
  <body>
    <main>
      <header><h1>La suerte está sobre la mesa.</h1><p>Cuatro palos. Trece valores. Una nueva carta en cada sorteo.</p></header>
      <div class="table"><div id="card" class="card" role="img" aria-label="Carta de la baraja"><span class="suit top" aria-hidden="true"></span><span id="value" aria-hidden="true"></span><span class="suit bottom" aria-hidden="true"></span></div></div>
      <p id="card-description" class="card-description" role="status" aria-live="polite"></p>
      <section class="controls" aria-label="Controles de la carta">
        <button id="draw" type="button">Generar nueva carta <span aria-hidden="true">↗</span></button>
        <label class="toggle"><input id="automatic" type="checkbox" checked /> Generar automáticamente cada 10 segundos</label>
        <fieldset id="dimensions">
          <legend>Tamaño de la carta</legend>
          <div class="dimensions">
            <label for="size">Tamaño <output id="size-value" for="size">100%</output>
              <input id="size" type="range" min="70" max="160" value="100" step="1" />
            </label>
          </div>
        </fieldset>
        <p class="hint">Arrastra hacia la izquierda para reducir y hacia la derecha para ampliar.</p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
